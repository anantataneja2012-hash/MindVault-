
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171d20"/>
      <stop offset="42%" stop-color="#46514f"/>
      <stop offset="75%" stop-color="#a09c89"/>
      <stop offset="100%" stop-color="#d0c6ae"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68736b"/>
      <stop offset="40%" stop-color="#303c3b"/>
      <stop offset="100%" stop-color="#141d1e"/>
    </linearGradient>

    <linearGradient id="mountainLight" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#b8b5a7"/>
      <stop offset="100%" stop-color="#59635e"/>
    </linearGradient>

    <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35413b"/>
      <stop offset="100%" stop-color="#101817"/>
    </linearGradient>

    <radialGradient id="horizonGlow">
      <stop offset="0%" stop-color="#d6c7a8" stop-opacity=".58"/>
      <stop offset="100%" stop-color="#d6c7a8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d0e" stop-opacity=".48"/>
      <stop offset="48%" stop-color="#080d0e" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#080d0e" stop-opacity=".58"/>
    </linearGradient>

    <filter id="softMist" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="distantBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- Low horizon light -->
  <ellipse cx="800" cy="570" rx="650" ry="230"
           fill="url(#horizonGlow)"/>

  <!-- Distant mountain range -->
  <path d="
    M0 570
    L130 480
    L245 535
    L390 365
    L490 455
    L630 300
    L760 440
    L915 280
    L1060 430
    L1190 340
    L1350 480
    L1470 390
    L1600 500
    L1600 680
    L0 680 Z"
    fill="#515e5a"
    opacity=".76"/>

  <!-- Snow and pale rock -->
  <path d="
    M300 475
    L390 365
    L490 455
    L445 420
    L400 430
    L380 405
    L350 445 Z"
    fill="#c1bdad"
    opacity=".42"/>

  <path d="
    M530 410
    L630 300
    L760 440
    L690 393
    L645 365
    L620 390
    L595 370 Z"
    fill="#d2cbbb"
    opacity=".5"/>

  <path d="
    M820 405
    L915 280
    L1060 430
    L980 370
    L935 355
    L910 375
    L875 340 Z"
    fill="#d5d0bf"
    opacity=".48"/>

  <!-- Nearer mountain silhouettes -->
  <path d="
    M0 630
    L150 525
    L270 580
    L430 455
    L570 565
    L740 435
    L890 575
    L1080 455
    L1230 565
    L1400 455
    L1600 590
    L1600 730
    L0 730 Z"
    fill="url(#mountainLight)"
    opacity=".72"/>

  <!-- Dark slopes -->
  <path d="
    M0 625
    L150 525
    L270 580
    L205 565
    L145 590
    L95 570
    L0 665 Z"
    fill="#303d39"
    opacity=".65"/>

  <path d="
    M740 435
    L890 575
    L810 530
    L765 540
    L720 500
    L680 535 Z"
    fill="#34423d"
    opacity=".62"/>

  <path d="
    M1080 455
    L1230 565
    L1150 530
    L1100 545
    L1055 510 Z"
    fill="#35413b"
    opacity=".55"/>

  <!-- Mist between mountains -->
  <g filter="url(#softMist)" opacity=".5">
    <path d="M-100 590 Q400 520 800 590 T1700 560"
          fill="none" stroke="#d6d0bd" stroke-width="70"/>
    <path d="M-100 650 Q400 585 800 640 T1700 620"
          fill="none" stroke="#d5d0c1" stroke-width="45"/>
  </g>

  <!-- Lake -->
  <path d="M0 650
           Q400 630 800 655
           Q1200 680 1600 645
           L1600 1000
           L0 1000 Z"
        fill="url(#water)"/>

  <!-- Reflected horizon -->
  <g opacity=".18" filter="url(#distantBlur)">
    <path d="M250 675 Q800 690 1350 670"
          stroke="#c5bba2" stroke-width="8" fill="none"/>
    <path d="M400 715 Q800 725 1200 710"
          stroke="#b5b09d" stroke-width="4" fill="none"/>
  </g>

  <!-- Water texture -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 735 Q360 728 520 738"
          stroke="#b4b09d" stroke-width="2" opacity=".16"/>
    <path d="M900 760 Q1100 750 1320 760"
          stroke="#c6c0aa" stroke-width="2" opacity=".14"/>
    <path d="M550 805 Q760 796 960 808"
          stroke="#a8aa99" stroke-width="2" opacity=".12"/>
    <path d="M100 860 Q330 850 500 862"
          stroke="#9fa99a" stroke-width="2" opacity=".12"/>
    <path d="M1050 900 Q1260 888 1510 901"
          stroke="#b0aa96" stroke-width="2" opacity=".1"/>
    <path d="M650 950 Q830 943 1010 952"
          stroke="#a6a997" stroke-width="2" opacity=".1"/>
  </g>

  <!-- Distant tree line -->
  <path d="
    M0 650
    L30 625 L42 650
    L70 610 L88 650
    L115 628 L130 650
    L160 615 L180 650
    L210 630 L225 650
    L260 615 L280 650
    L310 635 L330 650
    L360 620 L380 650
    L410 630 L430 650
    L470 620 L490 650
    L530 635 L550 650
    L580 625 L600 650
    L640 635 L660 650
    L700 625 L720 650
    L760 635 L780 650
    L820 620 L840 650
    L870 635 L890 650
    L930 620 L950 650
    L990 635 L1010 650
    L1050 615 L1070 650
    L1110 635 L1130 650
    L1170 620 L1190 650
    L1230 635 L1250 650
    L1290 615 L1310 650
    L1350 635 L1370 650
    L1410 615 L1430 650
    L1470 630 L1490 650
    L1530 610 L1550 650
    L1600 630
    L1600 690 L0 690 Z"
    fill="#1c2a27"
    opacity=".85"/>

  <!-- Foreground banks -->
  <path d="
    M0 790
    Q120 725 255 760
    Q360 800 475 850
    L475 1000 L0 1000 Z"
    fill="url(#foreground)"/>

  <path d="
    M1600 760
    Q1470 710 1360 770
    Q1260 815 1170 865
    L1170 1000 L1600 1000 Z"
    fill="url(#foreground)"/>

  <!-- Foreground vegetation -->
  <g fill="#111c19" opacity=".85">
    <path d="M0 850 L35 740 L70 850 Z"/>
    <path d="M40 875 L95 720 L150 875 Z"/>
    <path d="M120 900 L165 770 L210 900 Z"/>
    <path d="M1370 890 L1425 735 L1480 890 Z"/>
    <path d="M1450 870 L1500 720 L1550 870 Z"/>
    <path d="M1530 900 L1570 780 L1600 900 Z"/>
  </g>

  <!-- Atmospheric darkening -->
  <rect width="1600" height="1000" fill="url(#vignette)"/>

  <!-- Subtle film grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise"
                  baseFrequency=".8"
                  numOctaves="2"
                  stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 .08"/>
    </feComponentTransfer>
  </filter>

  <rect width="1600" height="1000"
        filter="url(#grain)" opacity=".22"/>

</svg>
