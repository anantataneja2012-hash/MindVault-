
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="eveningSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a1b"/>
      <stop offset="42%" stop-color="#374542"/>
      <stop offset="76%" stop-color="#857d6c"/>
      <stop offset="100%" stop-color="#c1ad8e"/>
    </linearGradient>

    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65716a"/>
      <stop offset="35%" stop-color="#303c38"/>
      <stop offset="100%" stop-color="#111a19"/>
    </linearGradient>

    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#727b70"/>
      <stop offset="100%" stop-color="#303c37"/>
    </linearGradient>

    <radialGradient id="lastLight">
      <stop offset="0%" stop-color="#d5b990" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#d5b990" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090f10" stop-opacity=".62"/>
      <stop offset="35%" stop-color="#090f10" stop-opacity="0"/>
      <stop offset="70%" stop-color="#090f10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#090f10" stop-opacity=".52"/>
    </linearGradient>

    <filter id="mistBlur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise"
                    baseFrequency=".75"
                    numOctaves="2"
                    stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .09"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Evening sky -->
  <rect width="1600" height="900" fill="url(#eveningSky)"/>

  <!-- Remaining light -->
  <ellipse cx="850" cy="515" rx="650" ry="210"
           fill="url(#lastLight)"/>

  <!-- Far mountains -->
  <path d="
    M0 530
    L150 425
    L280 490
    L430 340
    L560 450
    L710 300
    L850 445
    L1010 325
    L1160 455
    L1320 350
    L1450 445
    L1600 375
    L1600 650
    L0 650 Z"
    fill="#52605a"
    opacity=".86"/>

  <!-- Pale mountain edges -->
  <path d="
    M345 425
    L430 340
    L560 450
    L495 405
    L450 390
    L415 410 Z"
    fill="#b7b09c"
    opacity=".35"/>

  <path d="
    M630 375
    L710 300
    L850 445
    L775 390
    L730 365
    L695 385 Z"
    fill="#c4bca7"
    opacity=".4"/>

  <path d="
    M930 390
    L1010 325
    L1160 455
    L1080 405
    L1030 380
    L995 400 Z"
    fill="#bdb5a2"
    opacity=".32"/>

  <!-- Middle ridge -->
  <path d="
    M0 610
    L130 510
    L250 575
    L390 475
    L530 580
    L690 450
    L850 575
    L1030 460
    L1190 585
    L1370 470
    L1600 600
    L1600 700
    L0 700 Z"
    fill="url(#ridge)"/>

  <!-- Mountain shadows -->
  <path d="
    M0 610
    L130 510
    L250 575
    L180 550
    L130 570
    L85 555
    L0 640 Z"
    fill="#25332f"
    opacity=".62"/>

  <path d="
    M690 450
    L850 575
    L770 535
    L725 550
    L675 510
    L640 535 Z"
    fill="#25332f"
    opacity=".58"/>

  <path d="
    M1370 470
    L1600 600
    L1510 555
    L1450 565
    L1405 525 Z"
    fill="#26332e"
    opacity=".62"/>

  <!-- Mist -->
  <g filter="url(#mistBlur)" opacity=".42">
    <path d="M-100 610 Q400 550 800 610 T1700 600"
          fill="none" stroke="#d2c6ae" stroke-width="65"/>
    <path d="M-100 675 Q400 625 800 670 T1700 650"
          fill="none" stroke="#bcb7a4" stroke-width="42"/>
  </g>

  <!-- Lake -->
  <path d="
    M0 650
    Q400 635 800 660
    Q1200 680 1600 645
    L1600 900
    L0 900 Z"
    fill="url(#lake)"/>

  <!-- Reflection -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 690 Q800 700 1300 685"
          stroke="#d0b994" stroke-width="5" opacity=".16"/>
    <path d="M450 730 Q800 740 1150 728"
          stroke="#d0c2a8" stroke-width="3" opacity=".13"/>
    <path d="M180 775 Q430 767 650 780"
          stroke="#a9b0a1" stroke-width="2" opacity=".14"/>
    <path d="M930 795 Q1170 784 1420 798"
          stroke="#b4b19f" stroke-width="2" opacity=".13"/>
    <path d="M550 845 Q800 837 1030 849"
          stroke="#a8ad9e" stroke-width="2" opacity=".1"/>
  </g>

  <!-- Distant forest -->
  <path d="
    M0 660
    L25 625 L42 660
    L70 615 L90 660
    L120 630 L138 660
    L165 610 L185 660
    L215 630 L235 660
    L265 620 L285 660
    L315 635 L335 660
    L365 615 L385 660
    L415 635 L435 660
    L465 615 L485 660
    L515 630 L535 660
    L565 620 L585 660
    L615 635 L635 660
    L665 615 L685 660
    L715 635 L735 660
    L765 615 L785 660
    L815 630 L835 660
    L865 615 L885 660
    L915 635 L935 660
    L965 610 L985 660
    L1015 635 L1035 660
    L1065 620 L1085 660
    L1115 635 L1135 660
    L1165 610 L1185 660
    L1215 635 L1235 660
    L1265 615 L1285 660
    L1315 635 L1335 660
    L1365 615 L1385 660
    L1415 635 L1435 660
    L1465 615 L1485 660
    L1515 635 L1535 660
    L1565 610 L1585 660
    L1600 635
    L1600 700 L0 700 Z"
    fill="#1a2824"/>

  <!-- Left forest foreground -->
  <g fill="#101a17">
    <path d="M0 900 L0 570 L45 705 L20 705 L80 900 Z"/>
    <path d="M35 900 L105 555 L175 900 Z"/>
    <path d="M115 900 L190 620 L265 900 Z"/>
    <path d="M210 900 L280 680 L345 900 Z"/>
    <path d="M0 900 L0 790 L160 745 L310 900 Z"/>
  </g>

  <!-- Right forest foreground -->
  <g fill="#101a17">
    <path d="M1600 900 L1600 550 L1550 710 L1580 710 L1520 900 Z"/>
    <path d="M1565 900 L1495 540 L1425 900 Z"/>
    <path d="M1485 900 L1410 625 L1335 900 Z"/>
    <path d="M1390 900 L1320 680 L1255 900 Z"/>
    <path d="M1600 900 L1600 790 L1440 745 L1290 900 Z"/>
  </g>

  <!-- Subtle edge atmosphere -->
  <rect width="1600" height="900" fill="url(#edgeShade)"/>

  <!-- Film grain -->
  <rect width="1600" height="900"
        filter="url(#grain)" opacity=".2"/>

</svg>
