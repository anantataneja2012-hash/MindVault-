      const navLinks = $$('#nav a');

        if (m) a.classList.toggle('active', m[1] === route);
      });
    }

    function render(route){
      const appEl = $('#app');
      if (!appEl) return;
      const view = ROUTES[route] || view404;
      appEl.innerHTML = view();
      setActiveNav(route);
      
      const nav = $('#nav'), tg = $('#navToggle');

      if (route === '/') initCarousel();

      if (route === 'experiments') initExperiments();

      if (route === 'debate') initDebate();

    window.nav = function(route){
      route = route || '/';
      if (location.hash !== '#' + route) {

      }
      render(route);
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    };

    window.addEventListener('popstate', () => render(currentRoute()));
    window.addEventListener('hashchange', () => render(currentRoute()));

    /* ================= WIRING ================= */
    function initCarousel(){
      const slidesEl = $('#slides');
      if (!slidesEl) return;
      const dots = $$('#dots .dot');
      let i = 0, timer = null;
      const go = n => {
        i = (n + QUESTIONS.length) % QUESTIONS.length;
        slidesEl.style.transform = `translateX(-${i * 100}%)`;
        dots.forEach((d, k) => d.classList.toggle('active', k === i));
      };
      $$('[data-car]').forEach(b => b.addEventListener('click', () => {
        go(b.dataset.car === 'next' ? i + 1 : i - 1);
        restart();
      }));
      dots.forEach(d => d.addEventListener('click', () => { go(+d.dataset.i); restart(); }));
      const restart = () => { clearInterval(timer); timer = setInterval(() => go(i + 1), 7000); };
      restart();
      go(0);
    }

    function initPerception(){
      $$('.pcard').forEach(card => {
        const reveal = $('.reveal', card);
        $$('.opt button', card).forEach(btn => {
          btn.addEventListener('click', () => {
            $$('.opt button', card).forEach(b => b.classList.remove('sel'));
            btn.classList.add('sel');
            if (reveal) reveal.classList.add('on');
          });
        });
      });
    }

    function initExperiments(){
      const ab = $('#anchorBtn');
      if (ab) ab.addEventListener('click', () => {
        const v = $('#anchorIn').value.trim();
        const out = $('#anchorOut');
        out.innerHTML = v
          ? `You guessed <b>${esc(v)}</b>. The answer is <b>54</b>. Notice how far your guess sat from the number you were shown — that distance was not evidence, and it still moved you.`
          : 'Enter a number first — the willingness to commit is the whole point.';
        out.classList.add('on');
      });

      const rb = $('#reactBtn'), log = $('#reactLog');
      if (rb) {
        let state = 'idle', t0 = 0, times = [];
        const setLabel = (txt, colour) => {
          rb.textContent = txt;
          rb.style.background = colour || 'none';
          rb.style.color = colour ? '#0a0e15' : '';
        };
        rb.addEventListener('click', () => {
          if (state === 'idle') {
            state = 'waiting';
            setLabel('Wait for gold…');
            setTimeout(() => {
              if (state !== 'waiting') return;
              state = 'ready';
              setLabel('CLICK', 'var(--gold)');
              t0 = performance.now();
            }, 1200 + Math.random() * 1800);
          } else if (state === 'ready') {
            const ms = Math.round(performance.now() - t0);
            times.push(ms);
            times = times.slice(-5);
            state = 'idle';
            setLabel('Start');
            log.innerHTML = times.map(t => `<li>${t} ms</li>`).join('');
          } else {
            state = 'idle';
            setLabel('Start');
            log.innerHTML = `<li class="no">Too early — wait for gold.</li>` + log.innerHTML;
          }
        });
      }

      $$('[data-lure]').forEach(b => b.addEventListener('click', () => {
        const out = $('#lureOut');
        out.innerHTML = b.dataset.lure === 'yes'
          ? 'You "remember" it — but <b>“sleep” was never in the list</b>. Every word you read pointed at it. Memory stores gist, and gist quietly invents the rest.'
          : 'Correct — it was never there. <b>“Sleep”</b> was only implied by every surrounding word. Most people report seeing it, which is why the test works.';
        out.classList.add('on');
      }));
    }

    function initDiary(){
      const ta = $('#diaryText'), counter = $('#diaryCount');
      if (ta) ta.addEventListener('input', () => { counter.textContent = `${ta.value.length} / 600`; });
      const post = $('#diaryPost');
      if (post) post.addEventListener('click', () => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        const mine = store.get('diary', []);
        mine.unshift({ id: 'e' + Date.now(), handle: randomHandle(), ts: Date.now(), text });
        store.set('diary', mine.slice(0, 100));
        ta.value = ''; counter.textContent = '0 / 600';
        render('diary');
      });
    }

    function initDebate(){
      const data = store.get('debate', {});
      const save = () => store.set('debate', data);

      $$('[data-addfor]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.addfor;
        const input = $(`[data-for="${id}"]`);
        const text = input.value.trim();
        if (!text) return;
        data[id] = data[id] || { for: [], against: [] };
        data[id].for.unshift({ handle: randomHandle(), text });
        save(); render('debate');
      }));

      $$('[data-addagainst]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.addagainst;
        const input = $(`[data-against="${id}"]`);
        const text = input.value.trim();
        if (!text) return;
        data[id] = data[id] || { for: [], against: [] };
        data[id].against.unshift({ handle: randomHandle(), text });
        save(); render('debate');
      }));
    }

    /* ================= GLOBAL ACTIONS ================= */
    window.clearAll = function(){
      ['diary','debate'].forEach(k => store.del(k));
      const s = $('#deletionStatus');
      if (s) { s.textContent = 'All MindVault data has been deleted from this browser.'; s.style.color = 'var(--ok)'; }
    };

    /* ================= BOOT ================= */
    function boot() {
      const navToggle = $('#navToggle');
      if (navToggle) {
        navToggle.addEventListener('click', () => {
          const navEl = $('#nav');
          if (navEl) {
            const open = navEl.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', String(open));
          }
        });
      }

      const yrEl = $('#yr');
      if (yrEl) yrEl.textContent = new Date().getFullYear();

      render(currentRoute());
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
